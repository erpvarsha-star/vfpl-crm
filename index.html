<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Varsha CRM</title>
<style>
  :root {
    --navy: #0f2340;
    --navy-deep: #091629;
    --navy-line: #1d3a63;
    --orange: #f26b1d;
    --orange-hover: #ff7f33;
    --text: #ffffff;
    --text-dim: #a9bad3;
    --paper: #f4f6fa;
    --card: #ffffff;
    --ink: #14243d;
    --ink-dim: #5b6b83;
    --line: #dde3ee;
    --ok: #1a7f4b;
    --ok-bg: #e2f4ea;
    --warn: #b45309;
    --warn-bg: #fdecd8;
    --risk: #b42318;
    --risk-bg: #fde4e1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }

  /* ---------- header ---------- */
  header {
    background: radial-gradient(ellipse at 30% 0%, var(--navy) 0%, var(--navy-deep) 80%);
    background-color: var(--navy-deep);
    color: var(--text);
    padding: 36px 16px 32px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .head-row { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; }
  .company { font-size: .85rem; letter-spacing: .22em; text-transform: uppercase; color: var(--text-dim); }
  h1 { font-size: clamp(2.6rem, 9vw, 4.6rem); font-weight: 800; line-height: 1; letter-spacing: -.02em; margin: 8px 0 10px; }
  h1 span { color: var(--orange); }
  .date { font-size: 1.05rem; font-weight: 600; color: var(--text-dim); }
  .btn-add {
    background: var(--orange); color: #fff; border: 0; cursor: pointer;
    font: inherit; font-size: 1.15rem; font-weight: 700;
    padding: 16px 30px; border-radius: 12px;
    box-shadow: 0 8px 24px rgba(242,107,29,.35);
    transition: background .15s, transform .15s;
  }
  .btn-add:hover { background: var(--orange-hover); transform: translateY(-2px); }
  .btn-add:focus-visible, .chip:focus-visible, .btn:focus-visible, th button:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }

  /* ---------- toolbar ---------- */
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 8px; }
  .chip {
    font: inherit; font-size: .95rem; font-weight: 600; cursor: pointer;
    padding: 9px 16px; border-radius: 999px;
    border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
  }
  .chip b { margin-left: 6px; }
  .chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
  .search {
    margin-left: auto; flex: 1 1 220px; max-width: 320px;
    font: inherit; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
  }
  .search:focus { outline: 3px solid var(--orange); outline-offset: 1px; border-color: var(--orange); }
  .rule { font-size: .85rem; color: var(--ink-dim); margin: 6px 0 16px; line-height: 1.5; }

  /* ---------- table ---------- */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 14px 16px; vertical-align: middle; }
  thead th { background: var(--navy); color: #fff; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; white-space: nowrap; }
  th button { all: unset; cursor: pointer; }
  tbody tr + tr td { border-top: 1px solid var(--line); }
  tbody tr:hover td { background: #f8f9fc; }
  td.name { font-weight: 700; }
  .tag { display: inline-block; margin-left: 8px; font-size: .7rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; background: var(--risk-bg); color: var(--risk); vertical-align: middle; }
  .muted { color: var(--ink-dim); }
  td a { color: var(--navy); text-decoration: none; border-bottom: 1px dotted var(--ink-dim); }
  td a:hover { color: var(--orange); border-color: var(--orange); }
  .s-active { background: var(--ok-bg); color: var(--ok); }
  .s-follow { background: var(--warn-bg); color: var(--warn); }
  .s-risk   { background: var(--risk-bg); color: var(--risk); }
  select.st { appearance: none; -webkit-appearance: none; cursor: pointer; border: 0; font: inherit; font-weight: 700; font-size: .85rem;
    padding: 6px 30px 6px 14px; border-radius: 999px; width: auto;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  select.st.s-active { background-color: var(--ok-bg); color: var(--ok); }
  select.st.s-follow { background-color: var(--warn-bg); color: var(--warn); }
  select.st.s-risk   { background-color: var(--risk-bg); color: var(--risk); }
  select.st:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
  .guess { color: var(--ink-dim); font-style: italic; }
  .unsaved { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 0 0 14px; padding: 10px 14px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: .9rem; font-weight: 600; }
  .unsaved .btn { padding: 7px 14px; font-size: .85rem; }
  .rm { font: inherit; border: 0; background: none; color: var(--ink-dim); cursor: pointer; font-size: 1.2rem; padding: 2px 8px; border-radius: 6px; }
  .rm:hover { color: var(--risk); background: var(--risk-bg); }
  .empty { padding: 40px 16px; text-align: center; color: var(--ink-dim); }
  .foot { margin-top: 16px; font-size: .85rem; color: var(--ink-dim); }

  /* ---------- dialog / form ---------- */
  dialog { margin: auto; border: 0; border-radius: 16px; padding: 0; overflow: hidden; width: min(480px, calc(100vw - 32px)); box-shadow: 0 24px 60px rgba(9,22,41,.45); }
  dialog::backdrop { background: rgba(9,22,41,.6); }
  .dlg-head { background: var(--navy); color: #fff; padding: 18px 22px; font-size: 1.2rem; font-weight: 800; }
  form { padding: 20px 22px 22px; display: grid; gap: 14px; }
  label { display: grid; gap: 5px; min-width: 0; font-size: .85rem; font-weight: 700; color: var(--ink); }
  label small { font-weight: 400; color: var(--ink-dim); }
  input, select { width: 100%; min-width: 0; font: inherit; font-size: 1rem; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; color: var(--ink); background: #fff; }
  input:focus, select:focus { outline: 3px solid var(--orange); outline-offset: 1px; border-color: var(--orange); }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }
  .btn { font: inherit; font-weight: 700; padding: 11px 20px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
  .btn.primary { background: var(--orange); border-color: var(--orange); color: #fff; }
  .btn.primary:hover { background: var(--orange-hover); }
  .note { font-size: .8rem; color: var(--ink-dim); }

  /* ---------- phone: rows become cards ---------- */
  @media (max-width: 760px) {
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr { padding: 14px 16px; }
    tbody tr + tr { border-top: 1px solid var(--line); }
    tbody tr + tr td { border-top: 0; }
    td { padding: 3px 0; display: flex; justify-content: space-between; gap: 16px; }
    td::before { content: attr(data-label); color: var(--ink-dim); font-size: .8rem; font-weight: 600; flex: none; }
    td.name { display: block; font-size: 1.05rem; padding-bottom: 6px; }
    td.name::before { content: none; }
    td.act { justify-content: flex-end; }
    td.act::before { content: none; }
    .search { max-width: none; margin-left: 0; flex-basis: 100%; }
    .two { grid-template-columns: 1fr; }
    .btn-add { width: 100%; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap head-row">
    <div>
      <div class="company">Varsha Forgings</div>
      <h1>Varsha <span>CRM</span></h1>
      <div class="date" id="today"></div>
    </div>
    <button class="btn-add" id="openForm" type="button">+ Add customer</button>
  </div>
</header>

<main>
  <div class="toolbar" role="group" aria-label="Filter by status">
    <button class="chip" data-f="all" aria-pressed="true">All <b id="n-all">0</b></button>
    <button class="chip" data-f="Active" aria-pressed="false">Active <b id="n-Active">0</b></button>
    <button class="chip" data-f="Follow up" aria-pressed="false">Follow up <b id="n-Follow up">0</b></button>
    <button class="chip" data-f="At risk" aria-pressed="false">At risk <b id="n-At risk">0</b></button>
    <input class="search" id="q" type="search" placeholder="Search name, contact, phone, city" aria-label="Search customers">
  </div>
  <p class="rule" id="rule"></p>
  <div class="unsaved" id="unsaved" hidden>
    <span id="unsavedMsg"></span>
    <button class="btn" type="button" id="export">Download customers.json</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th><button data-sort="name">Customer</button></th>
          <th>Contact person</th>
          <th>Phone</th>
          <th>City</th>
          <th><button data-sort="last">Last order</button></th>
          <th><button data-sort="status">Status</button></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No customers match.</div>
  </div>
  <p class="foot" id="foot"></p>
</main>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlg-head" id="dlgTitle">Add customer</div>
  <form id="form" method="dialog">
    <label>Customer name *
      <input name="name" required maxlength="120" autocomplete="off">
    </label>
    <div class="two">
      <label>Contact person
        <input name="contact" maxlength="80" autocomplete="off">
      </label>
      <label>Phone
        <input name="phone" type="tel" maxlength="30" autocomplete="off">
      </label>
    </div>
    <div class="two">
      <label>City
        <input name="city" maxlength="60" autocomplete="off">
      </label>
      <label>Last order date
        <input name="last" type="date">
      </label>
    </div>
    <label>Status
      <select name="status">
        <option>Active</option>
        <option>Follow up</option>
        <option>At risk</option>
      </select>
    </label>
    <p class="note">Saved in this browser first. Use "Download customers.json" and commit it to share the change.</p>
    <div class="actions">
      <button class="btn" type="button" id="cancel">Cancel</button>
      <button class="btn primary" type="submit">Save customer</button>
    </div>
  </form>
</dialog>

<script>
/* ---------------------------------------------------------------
   Customer data lives in customers.json (in git). Edits made here,
   such as a new customer or a changed status, are kept in this browser
   until you download customers.json and commit it.
   --------------------------------------------------------------- */
var LOCAL_KEY = "varsha-crm-local-v2";
var ORDER = { "At risk": 0, "Follow up": 1, "Active": 2 };
var STATUSES = ["Active", "Follow up", "At risk"];

function fmtDate(iso) {
  if (!iso) return "";
  return new Date(iso + "T00:00:00Z").toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
}
function fmtPhone(p) {
  var d = String(p || "").replace(/\s+/g, "");
  return /^\d{10}$/.test(d) ? d.slice(0, 5) + " " + d.slice(5) : String(p || "").trim();
}

var customers = [];
var local = { added: [], status: {} };

function readLocal() {
  try {
    var v = JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}") || {};
    local.added = Array.isArray(v.added) ? v.added : [];
    local.status = v.status && typeof v.status === "object" ? v.status : {};
  } catch (e) { /* storage blocked: the list still works, edits just won't persist */ }
}
function writeLocal() {
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(local)); } catch (e) {}
}
function clean(c, added) {
  return { name: String(c.name || "").trim(), contact: c.contact || "", contactFrom: c.contactFrom || "",
           city: c.city || "", state: c.state || "", phone: c.phone || "", last: c.last || "",
           status: ORDER.hasOwnProperty(c.status) ? c.status : "Active", disputed: !!c.disputed, added: !!added };
}
function build(base) {
  readLocal();
  var names = {};
  customers = base.map(function (c) { names[c.name] = 1; return clean(c, false); });
  // drop local leftovers that the committed file already contains
  local.added = local.added.filter(function (c) { return c && c.name && !names[c.name]; });
  Object.keys(local.status).forEach(function (n) {
    var c = customers.filter(function (x) { return x.name === n; })[0];
    if (!c || c.status === local.status[n] || !ORDER.hasOwnProperty(local.status[n])) delete local.status[n];
    else c.status = local.status[n];
  });
  local.added.forEach(function (c) { customers.push(clean(c, true)); });
  writeLocal();
}

/* ---------- render ---------- */
var state = { filter: "all", q: "", sort: "last", dir: 1 };
var $ = function (id) { return document.getElementById(id); };

function cls(status) { return status === "Active" ? "s-active" : status === "Follow up" ? "s-follow" : "s-risk"; }
var baseStatus = {};
function setStatus(c, v) {
  c.status = v;
  if (c.added) local.added.forEach(function (a) { if (a.name === c.name) a.status = v; });
  else if (baseStatus[c.name] === v) delete local.status[c.name];
  else local.status[c.name] = v;
  writeLocal(); render();
}
function cell(tr, label, cls) {
  var td = document.createElement("td");
  td.dataset.label = label;
  if (cls) td.className = cls;
  tr.appendChild(td);
  return td;
}
function dash(td) { td.textContent = "—"; td.classList.add("muted"); }

function render() {
  var q = state.q.trim().toLowerCase();
  var list = customers.filter(function (c) {
    if (state.filter !== "all" && c.status !== state.filter) return false;
    return !q || (c.name + " " + c.contact + " " + c.phone + " " + c.city).toLowerCase().indexOf(q) !== -1;
  });
  list.sort(function (a, b) {
    var r;
    if (state.sort === "name") r = a.name.toLowerCase().localeCompare(b.name.toLowerCase());
    else if (state.sort === "last") r = (a.last || "").localeCompare(b.last || "") * -1;
    else r = ORDER[a.status] - ORDER[b.status] || (b.last || "").localeCompare(a.last || "");
    return r * state.dir || a.name.localeCompare(b.name);
  });

  var body = $("rows");
  body.textContent = "";
  list.forEach(function (c) {
    var tr = document.createElement("tr");
    var n = cell(tr, "Customer", "name");
    n.appendChild(document.createTextNode(c.name));
    if (c.disputed) { var t = document.createElement("span"); t.className = "tag"; t.textContent = "Disputed"; n.appendChild(t); }

    var p = cell(tr, "Contact person");
    if (!c.contact) dash(p);
    else {
      p.textContent = c.contact;
      if (c.contactFrom === "email") { p.classList.add("guess"); p.title = "Guessed from the email address"; }
    }

    var ph = cell(tr, "Phone");
    if (!c.phone) dash(ph);
    else if (/^\d{10}$/.test(c.phone.replace(/\s+/g, ""))) {
      var a = document.createElement("a");
      a.href = "tel:+91" + c.phone.replace(/\s+/g, "");
      a.textContent = fmtPhone(c.phone);
      ph.appendChild(a);
    } else ph.textContent = fmtPhone(c.phone);

    var ci = cell(tr, "City");
    if (c.city) ci.textContent = c.city;
    else if (c.state) { ci.textContent = c.state; ci.classList.add("guess"); ci.title = "State from the GST number; city not known"; }
    else dash(ci);

    var l = cell(tr, "Last order");
    c.last ? l.textContent = fmtDate(c.last) : dash(l);

    var s = cell(tr, "Status");
    var sel = document.createElement("select");
    sel.className = "st " + cls(c.status);
    sel.setAttribute("aria-label", "Status for " + c.name);
    STATUSES.forEach(function (o) {
      var op = document.createElement("option"); op.textContent = o; op.selected = o === c.status; sel.appendChild(op);
    });
    sel.addEventListener("change", function () { setStatus(c, sel.value); });
    s.appendChild(sel);

    var act = cell(tr, "", "act");
    if (c.added) {
      var x = document.createElement("button");
      x.className = "rm"; x.type = "button"; x.textContent = "×";
      x.setAttribute("aria-label", "Remove " + c.name);
      x.addEventListener("click", function () {
        if (confirm("Remove " + c.name + " from this list?")) {
          customers.splice(customers.indexOf(c), 1);
          local.added = local.added.filter(function (a) { return a.name !== c.name; });
          writeLocal(); render();
        }
      });
      act.appendChild(x);
    }
    body.appendChild(tr);
  });
  $("empty").hidden = list.length > 0;

  var counts = { all: customers.length, "Active": 0, "Follow up": 0, "At risk": 0 };
  customers.forEach(function (c) { counts[c.status]++; });
  Object.keys(counts).forEach(function (k) { $("n-" + k).textContent = counts[k]; });
  $("foot").textContent = "Showing " + list.length + " of " + customers.length + " customers.";
  var edits = Object.keys(local.status).length + local.added.length;
  $("unsaved").hidden = edits === 0;
  $("unsavedMsg").textContent = edits + " change" + (edits === 1 ? "" : "s") + " saved in this browser only.";
}

$("today").textContent = new Date().toLocaleDateString("en-IN", {
  weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "Asia/Kolkata"
});
$("rule").textContent = "Pick a status from the dropdown on each row. Last order is the customer's latest invoice date in the Collections sheet (it runs to 12 Jul 2026). Grey italic contact names are guessed from email addresses, and grey states come from GST numbers.";

document.querySelectorAll(".chip").forEach(function (b) {
  b.addEventListener("click", function () {
    state.filter = b.dataset.f;
    document.querySelectorAll(".chip").forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
    render();
  });
});
$("q").addEventListener("input", function (e) { state.q = e.target.value; render(); });
document.querySelectorAll("th button").forEach(function (b) {
  b.addEventListener("click", function () {
    var k = b.dataset.sort;
    state.dir = state.sort === k ? -state.dir : 1;
    state.sort = k;
    render();
  });
});

/* ---------- add customer ---------- */
var dlg = $("dlg"), form = $("form");
$("openForm").addEventListener("click", function () { form.reset(); dlg.showModal(); form.name.focus(); });
$("cancel").addEventListener("click", function () { dlg.close(); });
form.addEventListener("submit", function (e) {
  e.preventDefault();
  var f = new FormData(form);
  var name = String(f.get("name")).trim();
  if (!name) return;
  if (customers.some(function (c) { return c.name.toLowerCase() === name.toLowerCase(); })) {
    alert(name + " is already in the list."); return;
  }
  var c = clean({ name: name, contact: String(f.get("contact")).trim(), phone: String(f.get("phone")).trim(),
                  city: String(f.get("city")).trim(), last: String(f.get("last") || ""),
                  status: String(f.get("status")) }, true);
  customers.push(c);
  local.added.push({ name: c.name, contact: c.contact, phone: c.phone, city: c.city, last: c.last, status: c.status });
  writeLocal();
  dlg.close();
  state.filter = "all"; state.q = ""; $("q").value = "";
  document.querySelectorAll(".chip").forEach(function (o) { o.setAttribute("aria-pressed", String(o.dataset.f === "all")); });
  render();
});

/* ---------- export + load ---------- */
$("export").addEventListener("click", function () {
  var out = customers.map(function (c) {
    return { name: c.name, contact: c.contact, contactFrom: c.contactFrom, city: c.city, state: c.state,
             phone: c.phone, last: c.last, status: c.status, disputed: c.disputed };
  });
  var blob = new Blob([JSON.stringify({ note: loadedNote, customers: out }, null, 2) + "\n"], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "customers.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
});

var loadedNote = "";
function start(doc) {
  loadedNote = doc.note || "";
  doc.customers.forEach(function (c) { baseStatus[c.name] = ORDER.hasOwnProperty(c.status) ? c.status : "Active"; });
  build(doc.customers);
  render();
}
var source = window.CRM_DATA ? Promise.resolve(window.CRM_DATA)
  : fetch("customers.json", { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
source.then(start).catch(function (err) {
  $("empty").hidden = false;
  $("empty").textContent = "Could not load customers.json (" + err.message + "). Open this page from the website or a local web server, not by double-clicking the file.";
});
</script>
</body>
</html>
