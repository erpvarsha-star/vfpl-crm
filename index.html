<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'">
<title>Varsha CRM</title>
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="stylesheet" href="css/base.css?v=2">
<link rel="stylesheet" href="css/customers.css?v=2">
<link rel="stylesheet" href="css/money.css?v=2">
<link rel="stylesheet" href="css/rfqs.css?v=2">
<link rel="stylesheet" href="css/schedule.css?v=2">
<link rel="stylesheet" href="css/revenue.css?v=2">
<link rel="stylesheet" href="css/report.css?v=2">
<link rel="stylesheet" href="css/dashboard.css?v=2">
<link rel="stylesheet" href="css/export.css?v=2">
</head>
<body>
<div id="app">
  <header>
    <div class="wrap head-row">
      <div class="brand">
        <span class="logo-badge"><img src="assets/varsha-logo.jpg" alt="Varsha Forgings" width="64" height="64"></span>
        <div>
          <div class="company">Varsha Forgings</div>
          <h1>Varsha <span>CRM</span></h1>
          <div class="date" id="today"></div>
        </div>
      </div>
      <button class="btn-add" id="openForm" type="button">+ Add customer</button>
    </div>
  </header>

  <div class="tabbar">
    <!-- To add a module: one button here, one section below, one css link, one script tag. Tab order is the order in this list. -->
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" id="tab-dash" aria-controls="panel-dash" aria-selected="false" tabindex="-1">Dashboard</button>
      <button class="tab" role="tab" id="tab-list" aria-controls="panel-list" aria-selected="false" tabindex="-1">Customers</button>
      <button class="tab" role="tab" id="tab-rfqs" aria-controls="panel-rfqs" aria-selected="false" tabindex="-1">RFQs</button>
      <button class="tab" role="tab" id="tab-schedule" aria-controls="panel-schedule" aria-selected="false" tabindex="-1">Schedule</button>
      <button class="tab" role="tab" id="tab-export" aria-controls="panel-export" aria-selected="false" tabindex="-1">Export</button>
    </nav>
  </div>

  <main>
    <div class="banner bad" id="storageWarn" hidden role="alert">
      <span class="banner-text">This browser is blocking saved changes (a private window, or storage turned off). Changes will be lost when you refresh. Use "Download customers.json" to keep them.</span>
    </div>
    <div class="banner info" id="notice" hidden role="status">
      <span class="banner-text"></span>
      <button class="banner-x" type="button" aria-label="Dismiss message">×</button>
    </div>
    <div class="banner bad" id="syncErr" hidden role="alert">
      <span class="banner-text"></span>
      <button class="banner-x" type="button" aria-label="Dismiss message">×</button>
    </div>

    <section id="panel-dash" class="tabpanel" role="tabpanel" aria-labelledby="tab-dash" hidden></section>
    <section id="panel-list" class="tabpanel" role="tabpanel" aria-labelledby="tab-list" hidden></section>
    <section id="panel-rfqs" class="tabpanel" role="tabpanel" aria-labelledby="tab-rfqs" hidden></section>
    <section id="panel-schedule" class="tabpanel" role="tabpanel" aria-labelledby="tab-schedule" hidden></section>
    <section id="panel-export" class="tabpanel" role="tabpanel" aria-labelledby="tab-export" hidden></section>
  </main>
</div>
<div id="live" class="sr-only" aria-live="polite"></div>

<script src="js/store.js?v=2" defer></script>
<script src="js/csv.js?v=2" defer></script>
<script src="js/ui.js?v=2" defer></script>
<script src="js/importer.js?v=2" defer></script>
<script src="js/app.js?v=2" defer></script>
<script src="js/customers.js?v=2" defer></script>
<script src="js/money.js?v=2" defer></script>
<script src="js/rfqs.js?v=2" defer></script>
<script src="js/schedule.js?v=2" defer></script>
<script src="js/revenue.js?v=2" defer></script>
<script src="js/report.js?v=2" defer></script>
<script src="js/dashboard.js?v=2" defer></script>
<script src="js/export.js?v=2" defer></script>
<script src="js/boot.js?v=2" defer></script>
</body>
</html>
